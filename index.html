<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="description" content="Attention 知识导图：从模型结构和推理阶段逐级探索注意力机制。" />
    <title>学习小记（陈）</title>
    <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=3" />
    <script src="./app.js?v=3" defer></script>
  </head>
  <body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-map" viewBox="0 0 24 24">
        <circle cx="12" cy="4" r="2" /><circle cx="4" cy="19" r="2" /><circle cx="20" cy="19" r="2" />
        <path d="M12 6v6M12 12 5 17M12 12l7 5" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.6" /><path d="m16 16 4.5 4.5" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="知识导图目录">
        <div class="sidebar-current"><svg class="icon"><use href="#icon-map" /></svg><span>知识导图</span></div>
        <div class="sidebar-label">目录</div>
        <nav id="outline" class="outline" aria-label="节点目录"></nav>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div class="workspace-title"><svg class="icon"><use href="#icon-map" /></svg><h1>知识导图</h1></div>
          <div class="header-tools">
            <div class="search-wrap">
              <label class="search-box" for="node-search">
                <svg class="icon"><use href="#icon-search" /></svg>
                <input id="node-search" type="search" placeholder="搜索节点" autocomplete="off" aria-label="搜索导图节点" aria-controls="search-results" aria-expanded="false" />
                <kbd>Ctrl K</kbd>
              </label>
              <div id="search-results" class="search-results" hidden></div>
            </div>
            <a class="header-repo" href="https://github.com/WHUTcjh-2024/attention_chen" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库">
              <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 .5C5.73 .5.75 5.58.75 11.85c0 5.02 3.25 9.28 7.76 10.78.57.1.77-.24.77-.54 0-.27-.01-.98-.02-1.93-3.16.7-3.83-1.54-3.83-1.54-.52-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.21 1.77 1.21 1.03 1.78 2.7 1.27 3.36.97.1-.76.4-1.27.73-1.56-2.52-.29-5.17-1.28-5.17-5.69 0-1.26.45-2.3 1.2-3.11-.12-.3-.52-1.47.11-3.06 0 0 .98-.31 3.2 1.19a11.12 11.12 0 0 1 5.83 0c2.22-1.5 3.2-1.19 3.2-1.19.63 1.59.23 2.76.11 3.06.75.81 1.2 1.85 1.2 3.11 0 4.42-2.65 5.4-5.18 5.69.42.37.78 1.09.78 2.2 0 1.59-.02 2.87-.02 3.26 0 .3.2.65.78.54 4.5-1.5 7.75-5.76 7.75-10.78C23.25 5.58 18.27.5 12 .5Z" />
              </svg>
            </a>
          </div>
        </header>

        <div class="map-toolbar">
          <div class="map-location"><span>Attention</span><span aria-hidden="true">›</span><strong id="current-path">知识导图</strong></div>
          <div class="map-actions" aria-label="导图操作">
            <button id="expand-all" type="button">全部展开</button>
            <button id="collapse-all" type="button">全部收起</button>
          </div>
        </div>

        <section class="map-area" aria-label="Attention 知识导图">
          <div class="map-scroll">
            <div id="mind-map" class="mind-map"></div>
          </div>
          <p class="map-help">点击分支或分类，可逐级展开与收起内容</p>
        </section>
      </main>
    </div>
  </body>
</html>
