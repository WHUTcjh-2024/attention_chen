<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="description" content="Attention 知识导图：从模型结构和推理阶段逐级探索注意力机制。" />
    <title>Attention · 知识导图</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-map" viewBox="0 0 24 24">
        <circle cx="12" cy="4" r="2" /><circle cx="4" cy="19" r="2" /><circle cx="20" cy="19" r="2" />
        <path d="M12 6v6M12 12 5 17M12 12l7 5" />
      </symbol>
      <symbol id="icon-book" viewBox="0 0 24 24">
        <path d="M12 20c-2-1.5-4.5-2.2-9-2.2V4.5C7 4.5 10 5 12 7c2-2 5-2.5 9-2.5v13.3c-4.5 0-7 .7-9 2.2ZM12 7v13" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.6" /><path d="m16 16 4.5 4.5" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M6 3.5h8l4 4v13H6zM14 3.5v4h4M9 12h6M9 16h6" />
      </symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24">
        <path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="知识导图目录">
        <div class="sidebar-brand">
          <span class="brand-mark"><svg class="icon"><use href="#icon-book" /></svg></span>
          <span><strong>Attention Notebook</strong><small>注意力机制知识导图</small></span>
        </div>
        <div class="sidebar-current"><svg class="icon"><use href="#icon-map" /></svg><span>知识导图</span></div>
        <div class="sidebar-label">目录</div>
        <nav id="outline" class="outline" aria-label="节点目录"></nav>
        <a class="sidebar-repo" href="https://github.com/WHUTcjh-2024/attention_chen" target="_blank" rel="noopener noreferrer">在 GitHub 查看源码 <span aria-hidden="true">↗</span></a>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div class="workspace-title"><svg class="icon"><use href="#icon-map" /></svg><h1>知识导图</h1></div>
          <div class="header-tools">
            <div class="search-wrap">
              <label class="search-box" for="node-search">
                <svg class="icon"><use href="#icon-search" /></svg>
                <input id="node-search" type="search" placeholder="搜索节点" autocomplete="off" aria-label="搜索导图节点" aria-controls="search-results" aria-expanded="false" />
                <kbd>Ctrl K</kbd>
              </label>
              <div id="search-results" class="search-results" hidden></div>
            </div>
            <a class="header-repo" href="https://github.com/WHUTcjh-2024/attention_chen" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库">GitHub ↗</a>
          </div>
        </header>

        <div class="map-toolbar">
          <div class="map-location"><span>Attention</span><span aria-hidden="true">›</span><strong id="current-path">知识导图</strong></div>
          <div class="map-actions" aria-label="导图操作">
            <button id="expand-all" type="button">全部展开</button>
            <button id="collapse-all" type="button">全部收起</button>
          </div>
        </div>

        <section class="map-area" aria-label="Attention 知识导图">
          <div class="map-scroll" id="map-scroll" tabindex="0" aria-label="可滚动的 Attention 知识导图">
            <div id="mind-map" class="mind-map"></div>
          </div>
          <p class="map-help">点击节点上的 <strong>+</strong> 或 <strong>−</strong> 逐级展开与收起<span class="wide-hint"> · 内容较宽时可左右滚动</span></p>
        </section>
      </main>
    </div>
  </body>
</html>
