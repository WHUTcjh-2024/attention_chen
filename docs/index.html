<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <meta name="description" content="记录 Attention 算子开发与优化的理论和实操，形成可以逐级展开的知识网。">
    <title>Attention 知识网</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="site">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">A</span><span>ATTENTION<span class="brand-light"> / CHEN</span></span></div>
        <div class="intro">
          <p class="eyebrow">LEARNING MAP</p>
          <h1>从知识点<br>走向知识网。</h1>
          <p class="lede">记录理论与实操，逐步整理 Attention 算子开发与优化的学习路径。</p>
        </div>
        <div class="status"><span class="status-dot"></span>内容框架 · 持续整理中</div>
        <div class="guide">
          <p class="guide-title">如何浏览</p>
          <p>点击带有 <strong>＋</strong> 的节点展开下一级；再次点击收起。拖动画布移动，使用右下角按钮缩放。</p>
        </div>
        <a class="repo-link" href="https://github.com/WHUTcjh-2024/attention_chen" target="_blank" rel="noopener noreferrer">
          查看 GitHub 仓库 <span aria-hidden="true">↗</span>
        </a>
      </aside>
      <main class="workspace">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">INTERACTIVE KNOWLEDGE MAP</p>
            <h2>Attention 思维导图</h2>
          </div>
          <div class="header-meta" id="node-count" aria-live="polite"></div>
        </header>
        <section class="map-shell" aria-label="可交互的 Attention 多级思维导图">
          <div id="viewport" class="viewport">
            <div id="canvas" class="canvas">
              <svg id="links" class="links" aria-hidden="true"></svg>
              <div id="nodes" class="nodes"></div>
            </div>
          </div>
          <div class="map-tip">点击节点逐级展开 · 拖动画布探索</div>
          <div class="controls" aria-label="画布控制">
            <button id="expand-all" type="button" title="全部展开">展开全部</button>
            <button id="collapse-all" type="button" title="收起全部">收起全部</button>
            <span class="controls-separator"></span>
            <button id="zoom-out" type="button" aria-label="缩小">−</button>
            <button id="zoom-in" type="button" aria-label="放大">＋</button>
            <button id="fit" type="button" title="适应画布">适应</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
